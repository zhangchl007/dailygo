name: Native Domain And Legacy Regression

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  kotlin-domain:
    name: Kotlin Native Domain Acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Native JVM acceptance tests
        run: bash scripts/gradle.sh :domain:test --dependency-verification strict

  swift-domain:
    name: Swift Native Domain Acceptance
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select pinned Xcode toolchain
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Shared calendar and streak acceptance
        run: swift test --package-path mobile/ios/Packages/DailyGoDomain

  rust-core-tests:
    name: Preserved Legacy Rust Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --locked
